name: Build .NET Framework App

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore SalleSportApp/SalleSportApp.csproj

    - name: Build solution
      run: msbuild SalleSportApp/SalleSportApp.csproj /p:Configuration=Release
